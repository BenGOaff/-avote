# « Qui possède ton info » : propriétaires des médias, établis par IA avec citation vérifiée (scripts/medias.ts).
# Chaque trimestre : fiches absentes ou de plus de 120 jours, puis alertes Arcom (télé, radio) de plus de 90 jours.
# Dépense plafonnée par passage.
name: Médias

on:
  schedule:
    - cron: '41 3 3 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      media:
        description: 'Identifiant du média (ex. le-monde). Vide = automatique'
        required: false
      limit:
        description: 'Nombre de médias à traiter'
        default: '15'
      alertes:
        description: 'Alertes Arcom seulement (télé et radio)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: medias
  cancel-in-progress: false

jobs:
  medias:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Plafond mensuel commun à tous les robots : registres des dépenses du mois (scripts/cost.ts)
      - id: mois
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .budget/veille
          key: budget-veille-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-veille-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/positions
          key: budget-positions-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-positions-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/medias
          key: budget-medias-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-medias-${{ steps.mois.outputs.m }}-
      - name: Établir les fiches
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET_LEDGER_DIR: .budget/medias
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          MEDIAS_MODEL: ${{ vars.MEDIAS_MODEL }}
          MEDIAS_EFFORT: ${{ vars.MEDIAS_EFFORT }}
          MEDIAS_BUDGET_USD: ${{ vars.MEDIAS_BUDGET_USD }}
        run: |
          MODE=""
          if [ "${{ github.event.inputs.alertes }}" = "true" ]; then MODE="--alertes"; fi
          if [ -n "${{ github.event.inputs.media }}" ]; then
            npx tsx scripts/medias.ts $MODE --media=${{ github.event.inputs.media }}
          else
            npx tsx scripts/medias.ts $MODE --limit=${{ github.event.inputs.limit || 15 }}
            # Passage programmé : les alertes Arcom suivent les fiches
            if [ "${{ github.event_name }}" = "schedule" ]; then npx tsx scripts/medias.ts --alertes --limit=18; fi
          fi
      - name: Valider
        if: always()
        env:
          ANONYMITY_BLOCKLIST: ${{ secrets.ANONYMITY_BLOCKLIST }}
        run: npx tsx scripts/validate-content.ts
      - name: Proposer la mise à jour
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "medias-ca-vote[bot]"
          git config user.email "medias@users.noreply.github.com"
          if [ -z "$(git status --porcelain content/medias)" ]; then exit 0; fi
          STAMP=$(date -u +%Y%m%d-%H%M)
          # La branche part de la dernière version de main (sinon elle porterait d'anciens workflows et serait refusée)
          git stash push --include-untracked -- content/medias
          git fetch origin "${{ github.ref_name }}"
          git switch -c "medias/$STAMP" "origin/${{ github.ref_name }}"
          git checkout stash@{0} -- content/medias
          git add content/medias
          git commit -m "médias : fiches de propriété ($STAMP)"
          git push origin "medias/$STAMP"
          gh pr create --base "${{ github.ref_name }}" --head "medias/$STAMP" \
            --title "Médias $STAMP" \
            --body "Fiches de propriété établies par IA, citation vérifiée dans chaque source." \
            || echo "Pull Request non créée (réglage Actions) : la branche medias/$STAMP est poussée."
      - name: Inscrire la dépense du passage
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .budget/medias
          key: budget-medias-${{ steps.mois.outputs.m }}-${{ github.run_id }}-${{ github.run_attempt }}
