# Codage des positions des candidats par IA (scripts/positions.ts).
# Chaque lundi : les candidats jamais codés d'abord, puis les plus anciens ; seuls les thèmes périmés sont recherchés
# (positions connues de plus de 90 jours, introuvables de plus de 30 jours). Dépense plafonnée par passage.
name: Positions

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      actor:
        description: 'Identifiant du candidat (ex. marine-le-pen). Vide = automatique'
        required: false
      limit:
        description: 'Nombre de candidats à traiter'
        default: '2'
      recheck:
        description: 'Seulement repasser le contrôle de pertinence (aucune recherche web)'
        type: boolean
        default: false
      force:
        description: 'Rechercher tous les thèmes, même récents (programme tout juste publié)'
        type: boolean
        default: false
      source:
        description: 'Page officielle à lire en premier (programme publié)'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: positions
  cancel-in-progress: false

jobs:
  positions:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Plafond mensuel commun à tous les robots : registres des dépenses du mois (scripts/cost.ts)
      - id: mois
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .budget/veille
          key: budget-veille-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-veille-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/positions
          key: budget-positions-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-positions-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/medias
          key: budget-medias-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-medias-${{ steps.mois.outputs.m }}-
      - name: Coder les positions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET_LEDGER_DIR: .budget/positions
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          POSITIONS_MODEL: ${{ vars.POSITIONS_MODEL }}
          POSITIONS_EFFORT: ${{ vars.POSITIONS_EFFORT }}
          POSITIONS_JUDGE_MODEL: ${{ vars.POSITIONS_JUDGE_MODEL }}
          POSITIONS_BUDGET_USD: ${{ vars.POSITIONS_BUDGET_USD }}
        run: |
          if [ "${{ github.event.inputs.recheck }}" = "true" ]; then
            npx tsx scripts/positions.ts --recheck
          elif [ -n "${{ github.event.inputs.actor }}" ]; then
            EXTRA=""
            if [ "${{ github.event.inputs.force }}" = "true" ]; then EXTRA="--force"; fi
            if [ -n "${{ github.event.inputs.source }}" ]; then EXTRA="$EXTRA --source=${{ github.event.inputs.source }}"; fi
            npx tsx scripts/positions.ts --actor=${{ github.event.inputs.actor }} $EXTRA
          else
            npx tsx scripts/positions.ts --limit=${{ github.event.inputs.limit || vars.POSITIONS_PER_DAY || 2 }}
          fi
      - name: Synthèses des fiches
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET_LEDGER_DIR: .budget/positions
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          FICHES_MODEL: ${{ vars.FICHES_MODEL }}
          FICHES_BUDGET_USD: ${{ vars.FICHES_BUDGET_USD }}
        run: npx tsx scripts/fiches.ts
      - name: Valider
        id: valider
        if: always()
        env:
          ANONYMITY_BLOCKLIST: ${{ secrets.ANONYMITY_BLOCKLIST }}
        run: npx tsx scripts/validate-content.ts && npx vitest run
      - name: Proposer la mise à jour
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOMERGE: ${{ vars.POSITIONS_AUTOMERGE }}
        run: |
          git config user.name "positions-ca-vote[bot]"
          git config user.email "positions@users.noreply.github.com"
          if [ -z "$(git status --porcelain content/corpus content/acteurs/fiches.json)" ]; then exit 0; fi
          STAMP=$(date -u +%Y%m%d-%H%M)
          # Publication directe si les contrôles sont verts (citations retrouvées, pertinence, schéma, tests),
          # sauf si la rédaction a choisi la relecture (variable POSITIONS_AUTOMERGE = false)
          if [ "${{ steps.valider.outcome }}" = "success" ] && [ "$AUTOMERGE" != "false" ]; then
            git add content/corpus content/acteurs/fiches.json
            git commit -m "positions : mise à jour du référentiel ($STAMP)"
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "Publication directe impossible (conflit) : une Pull Request est proposée."
            git rebase --abort 2>/dev/null || true
            git reset --soft HEAD~1
          fi
          # La branche part de la dernière version de main (sinon elle porterait d'anciens workflows et serait refusée)
          git stash push --include-untracked -- content/corpus content/acteurs/fiches.json
          git fetch origin "${{ github.ref_name }}"
          git switch -c "positions/$STAMP" "origin/${{ github.ref_name }}"
          git checkout stash@{0} -- content/corpus content/acteurs/fiches.json
          git add content/corpus content/acteurs/fiches.json
          git commit -m "positions : mise à jour du référentiel ($STAMP)"
          git push origin "positions/$STAMP"
          gh pr create --base "${{ github.ref_name }}" --head "positions/$STAMP" \
            --title "Positions $STAMP" \
            --body "Positions codées par IA, citations vérifiées dans les sources. Détail des changements : content/corpus/changes.json." \
            || echo "Pull Request non créée (réglage Actions) : la branche positions/$STAMP est poussée."
      - name: Inscrire la dépense du passage
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .budget/positions
          key: budget-positions-${{ steps.mois.outputs.m }}-${{ github.run_id }}-${{ github.run_attempt }}
