# Guetteur de programmes (scripts/programmes.ts) : relit chaque matin les sites officiels des candidats.
# Un programme publié ou enrichi (nouveau PDF, ou bloc de phrases nouvelles sur une page programme) relance aussitôt
# la recherche de positions de ce candidat, en commençant par la page qui a changé. Aucun appel à une IA ici.
name: Programmes

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: programmes
  cancel-in-progress: false

jobs:
  programmes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Relire les sites officiels
        run: npx tsx scripts/programmes.ts
      - name: Sources officielles (parrainages publiés par le Conseil constitutionnel)
        run: npx tsx scripts/officiel.ts
      - name: Enregistrer l'état et relancer les candidats concernés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "programmes-ca-vote[bot]"
          git config user.email "programmes@users.noreply.github.com"
          git add content/acteurs/programmes-veille.json content/acteurs/parrainages.json content/acteurs/candidatures.json content/veille/officiel.json
          git commit -m "programmes : état des sites officiels et parrainages ($(date -u +%Y%m%d))" || true
          git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:${{ github.ref_name }} || true
          # Ouverture d'une source officielle : la rédaction est prévenue
          if [ -s .officiel-alert ]; then
            gh issue create --title "Source officielle : $(head -1 .officiel-alert | cut -c1-90)" --body "$(cat .officiel-alert)" || true
          fi
          # Candidat ajouté d'après les parrainages : recherche de ses positions et liste de ce qui reste à faire
          if [ -s .officiel-new-actors ]; then
            for SLUG in $(cat .officiel-new-actors); do
              gh workflow run positions.yml -f actor="$SLUG" || true
              NAME=$(node -e 'const c=require("./content/acteurs/candidatures.json");console.log((c.actors.find(a=>a.slug===process.argv[1])||{}).name||process.argv[1])' "$SLUG")
              gh issue create --title "Nouveau candidat : $NAME (portrait et site à ajouter)" --body "$(npx tsx scripts/a-completer.ts "$SLUG")" || true
            done
          fi
          if [ -s .programmes-changes ]; then
            while read -r SLUG URL <&3; do
              [ -n "$SLUG" ] && gh workflow run positions.yml -f actor="$SLUG" -f force=true -f source="$URL" || true
            done 3< .programmes-changes
          fi
