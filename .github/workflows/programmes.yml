# Guetteur de programmes (scripts/programmes.ts) : relit chaque matin les sites officiels des candidats.
# Un programme publié ou enrichi (nouveau PDF, ou bloc de phrases nouvelles sur une page programme) relance aussitôt
# la recherche de positions de ce candidat, en commençant par la page qui a changé. Aucun appel à une IA ici.
name: Programmes

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: programmes
  cancel-in-progress: false

jobs:
  programmes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Relire les sites officiels
        run: npx tsx scripts/programmes.ts
      - name: Enregistrer l'état et relancer les candidats concernés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "programmes-ca-vote[bot]"
          git config user.email "programmes@users.noreply.github.com"
          git add content/acteurs/programmes-veille.json
          git commit -m "programmes : état des sites officiels ($(date -u +%Y%m%d))" || true
          git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:${{ github.ref_name }} || true
          if [ -s .programmes-changes ]; then
            while read -r SLUG URL; do
              [ -n "$SLUG" ] && gh workflow run positions.yml -f actor="$SLUG" -f force=true -f source="$URL" || true
            done < .programmes-changes
          fi
