# Veille automatisée : collecte, brouillons rédigés par Claude, Pull Request à relire.
# Rien n'est publié sans fusion de la PR (sauf brèves si VEILLE_AUTOMERGE = true, voir docs/VEILLE.md).
name: Veille

on:
  schedule:
    # Heures UTC : ≈ 8 h, 13 h, 19 h à Paris (heure d'été). Trois passages suffisent pour un fil d'actu ; chacun est plafonné.
    - cron: '7 6,11,17 * * *'
  workflow_dispatch:
    inputs:
      article:
        description: 'Proposer aussi un article court'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Plafond mensuel commun à tous les robots : registres des dépenses du mois (scripts/cost.ts)
      - id: mois
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .budget/veille
          key: budget-veille-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-veille-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/positions
          key: budget-positions-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-positions-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/medias
          key: budget-medias-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-medias-${{ steps.mois.outputs.m }}-

      - name: Collecter et rédiger
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET_LEDGER_DIR: .budget/veille
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          VEILLE_MODEL: ${{ vars.VEILLE_MODEL }}
          VEILLE_EFFORT: ${{ vars.VEILLE_EFFORT }}
          VEILLE_SELECT_MODEL: ${{ vars.VEILLE_SELECT_MODEL }}
          VEILLE_BUDGET_USD: ${{ vars.VEILLE_BUDGET_USD }}
        run: |
          ARGS="--max=${{ vars.VEILLE_MAX || 6 }}"
          # Un article court par jour, sur la passe de 19 h (ou à la demande)
          if [ "${{ github.event.inputs.article }}" = "true" ] || [ "$(date -u +%H)" = "17" ]; then ARGS="$ARGS --article"; fi
          npx tsx scripts/veille.ts $ARGS

      - name: Valider les contenus
        env:
          ANONYMITY_BLOCKLIST: ${{ secrets.ANONYMITY_BLOCKLIST }}
        run: npx tsx scripts/validate-content.ts

      - name: Publier l'état de la veille et proposer les brouillons
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOMERGE: ${{ vars.VEILLE_AUTOMERGE }}
        run: |
          git config user.name "veille-ca-vote[bot]"
          git config user.email "veille@users.noreply.github.com"
          STAMP=$(date -u +%Y%m%d-%H%M)
          NEW=$(git ls-files --others --exclude-standard content/fil content/radar)

          # 1. L'état des flux, la mémoire des éléments vus et les candidatures (annonce ou retrait, citation vérifiée
          #    dans la source) vont directement sur la branche principale
          git add content/veille/status.json content/veille/seen.json content/acteurs/candidatures.json
          git commit -m "veille : état des flux ($STAMP)" || true

          if [ -n "$NEW" ] && [ "$AUTOMERGE" = "true" ]; then
            # Option assumée par la rédaction : brèves publiées directement, articles toujours relus
            BREVES=$(git ls-files --others --exclude-standard content/fil | tr '\n' ' ')
            git add content/fil
            git commit -m "veille : brèves ($STAMP)" || true
          fi
          # main a pu bouger pendant la veille : on se recale avant de pousser
          git stash push --include-untracked -- content/fil content/radar content/acteurs || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
          git stash pop || true
          # Les brèves publiées sont relayées sur les réseaux par social.yml (passage suivant), si elles le méritent
          # Nouveau candidat : la recherche de ses positions part tout de suite, sans attendre le passage hebdomadaire
          # et la rédaction est prévenue (issue GitHub) de ce qui reste à faire : portrait, site officiel, nuance
          if [ -s .veille-new-actors ]; then
            for SLUG in $(cat .veille-new-actors); do
              gh workflow run positions.yml -f actor="$SLUG" || true
              NAME=$(node -e 'const c=require("./content/acteurs/candidatures.json");console.log((c.actors.find(a=>a.slug===process.argv[1])||{}).name||process.argv[1])' "$SLUG")
              gh issue create --title "Nouveau candidat : $NAME (portrait et site à ajouter)" --body "$(npx tsx scripts/a-completer.ts "$SLUG")" || true
            done
          fi

          # 2. Les brouillons restants partent dans une Pull Request à relire
          REMAINING=$(git ls-files --others --exclude-standard content/fil content/radar)
          CAND=$(git status --porcelain content/acteurs)
          if [ -n "$REMAINING" ] || [ -n "$CAND" ]; then
            BRANCH="veille/$STAMP"
            git switch -c "$BRANCH"
            git add content/fil content/radar content/acteurs
            git commit -m "veille : brouillons à relire ($STAMP)"
            git push origin "$BRANCH"
            gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
              --title "Veille $STAMP : brouillons à relire" \
              --body-file .veille-summary.md
          fi
      - name: Inscrire la dépense du passage
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .budget/veille
          key: budget-veille-${{ steps.mois.outputs.m }}-${{ github.run_id }}-${{ github.run_attempt }}
