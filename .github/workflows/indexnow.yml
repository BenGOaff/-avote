# Signale les pages nouvelles ou modifiées à Bing et aux moteurs IndexNow (Bing alimente la recherche de ChatGPT et Copilot).
# Gratuit, sans compte : la clé est publiée à la racine du site (public/<clé>.txt).
name: IndexNow

on:
  push:
    branches: [main]
    paths: ['content/**', 'src/app/**']
  # Les robots publient avec le jeton GitHub, qui ne déclenche pas « push » : on passe après eux
  workflow_run:
    workflows: [Veille, Positions, Programmes]
    types: [completed]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Pages à signaler
        run: |
          SITE=https://xn--avote-xra.fr
          # Fichiers changés : depuis le push, ou depuis 3 heures après un robot
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-list -1 --before="3 hours ago" HEAD); fi
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          if [ "${{ github.event_name }}" = "workflow_run" ] && ! echo "$CHANGED" | grep -qE '^content/'; then echo "Rien de neuf"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          URLS="$SITE/ $SITE/test $SITE/radar $SITE/candidats $SITE/comparateur"
          # Articles du Radar ajoutés ou modifiés
          for f in $(echo "$CHANGED" | grep -E '^content/radar/.*\.md$'); do
            URLS="$URLS $SITE/radar/$(basename "$f" .md)"
          done
          # Positions des candidats modifiées : toutes les pages par sujet changent
          if echo "$CHANGED" | grep -qE '^content/(corpus|acteurs|questionnaire)/'; then
            URLS="$URLS $SITE/programmes"
            echo "SUJETS=1" >> "$GITHUB_ENV"
          fi
          echo "URLS=$URLS" >> "$GITHUB_ENV"
      # Laisser le temps au déploiement Hostinger de publier la nouvelle version
      - run: sleep 300
        if: env.SKIP != '1'
      - name: Envoi IndexNow
        if: env.SKIP != '1'
        run: |
          KEY=$(basename public/*.txt .txt | grep -E '^[0-9a-f]{32}$' | head -1)
          # Adresses des pages par sujet lues dans le plan du site en ligne (aucune liste à tenir à la main)
          if [ -n "$SUJETS" ]; then
            URLS="$URLS $(curl -sS https://xn--avote-xra.fr/sitemap.xml | grep -oE '<loc>[^<]*/programmes/[^<]*</loc>' | sed -E 's#</?loc>##g' | tr '\n' ' ')"
          fi
          LIST=$(printf '"%s",' $URLS | sed 's/,$//')
          curl -sS -o /dev/null -w "IndexNow : %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"xn--avote-xra.fr\",\"key\":\"$KEY\",\"keyLocation\":\"https://xn--avote-xra.fr/$KEY.txt\",\"urlList\":[$LIST]}"
