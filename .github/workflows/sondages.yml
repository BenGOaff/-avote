# Robot des sondages (scripts/sondages.ts) : lit chaque jour les notices de la Commission des sondages, relève les
# intentions de vote pour la présidentielle et met à jour la page /sondages. Petit modèle, dépense plafonnée par passage
# (SONDAGES_BUDGET_USD) et par mois (MONTHLY_BUDGET_USD, commun aux robots).
name: Sondages

on:
  schedule:
    - cron: '41 8,19 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'Nombre maximal de notices lues (40 pour un premier remplissage)'
        default: '8'

permissions:
  contents: write

concurrency:
  group: sondages
  cancel-in-progress: false

jobs:
  sondages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: mois
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .budget/veille
          key: budget-veille-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-veille-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/positions
          key: budget-positions-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-positions-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/medias
          key: budget-medias-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-medias-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/intox
          key: budget-intox-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-intox-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/sondages
          key: budget-sondages-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-sondages-${{ steps.mois.outputs.m }}-
      - name: Relever les sondages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET_LEDGER_DIR: .budget/sondages
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          SONDAGES_MODEL: ${{ vars.SONDAGES_MODEL }}
          SONDAGES_BUDGET_USD: ${{ vars.SONDAGES_BUDGET_USD }}
        run: npx tsx scripts/sondages.ts --max=${{ github.event.inputs.max || 8 }}
      - name: Valider
        env:
          ANONYMITY_BLOCKLIST: ${{ secrets.ANONYMITY_BLOCKLIST }}
        run: npx tsx scripts/validate-content.ts
      - name: Publier
        run: |
          git config user.name "sondages-ca-vote[bot]"
          git config user.email "sondages@users.noreply.github.com"
          git add content/sondages
          git commit -m "sondages : relevé des notices de la Commission des sondages ($(date -u +%Y%m%d-%H%M))" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:${{ github.ref_name }}
      - name: Inscrire la dépense du passage
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .budget/sondages
          key: budget-sondages-${{ steps.mois.outputs.m }}-${{ github.run_id }}-${{ github.run_attempt }}
