# Réseaux sociaux (scripts/social-plan.ts) : chaque jour, des publications tirées du site (pépite du matin,
# rendez-vous du soir, flash quand une nouveauté le mérite), avec leur visuel et leur page (/social/<id>).
# Facebook et LinkedIn via Zapier (flux /social/facebook.xml et linkedin.xml) ; X via scripts/social-x.ts (secret X_AUTH_TOKEN).
name: Réseaux sociaux

on:
  schedule:
    # Heures UTC : ≈ 8 h 40, 13 h 40, 18 h 40 et 20 h 40 à Paris (heure d'été)
    - cron: '40 6,11,16,18 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Passage : matin (pépite), midi (flash), soir (rendez-vous), nuit (flash)'
        required: false

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Plafond mensuel commun à tous les robots (scripts/cost.ts)
      - id: mois
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .budget/social
          key: budget-social-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-social-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/veille
          key: budget-veille-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-veille-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/positions
          key: budget-positions-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-positions-${{ steps.mois.outputs.m }}-
      - uses: actions/cache/restore@v4
        with:
          path: .budget/medias
          key: budget-medias-${{ steps.mois.outputs.m }}-aucun
          restore-keys: budget-medias-${{ steps.mois.outputs.m }}-
      - name: Préparer les publications
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET_LEDGER_DIR: .budget/social
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          SOCIAL_MODEL: ${{ vars.SOCIAL_MODEL }}
          SOCIAL_BUDGET_USD: ${{ vars.SOCIAL_BUDGET_USD }}
          SOCIAL_MAX_PER_DAY: ${{ vars.SOCIAL_MAX_PER_DAY }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ]; then
            case "$(date -u +%H)" in 06) SLOT=matin ;; 11) SLOT=midi ;; 16) SLOT=soir ;; *) SLOT=nuit ;; esac
          fi
          npx tsx scripts/social-plan.ts --slot=$SLOT
      - name: Valider
        run: npx tsx scripts/validate-content.ts
      - name: Mettre en ligne les publications (pages, visuels, flux)
        run: |
          git config user.name "social-ca-vote[bot]"
          git config user.email "social@users.noreply.github.com"
          git add content/social
          git commit -m "réseaux : publications du $(date -u +%Y-%m-%d) ($(date -u +%H)h)" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:${{ github.ref_name }}
      # X sans API officielle : navigateur sans écran sur la session du compte (secret X_AUTH_TOKEN)
      - name: Publier sur X
        id: x
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          if [ -z "$X_AUTH_TOKEN" ]; then echo "Secret X_AUTH_TOKEN absent : X ignoré"; exit 0; fi
          npx playwright-core install --with-deps chromium
          npx tsx scripts/social-x.ts
      - name: Garder la trace des publications sur X
        if: always()
        run: |
          [ -f content/social/_x.json ] || exit 0
          git add content/social/_x.json
          git commit -m "réseaux : publié sur X ($(date -u +%Y-%m-%d) $(date -u +%H)h)" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:${{ github.ref_name }}
      - name: Captures en cas d'échec sur X
        if: failure() && steps.x.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: x-debug
          path: .x-debug
          include-hidden-files: true
          retention-days: 3
      - name: Inscrire la dépense du passage
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .budget/social
          key: budget-social-${{ steps.mois.outputs.m }}-${{ github.run_id }}-${{ github.run_attempt }}
