# Chaînes YouTube qui parlent politique (scripts/youtube.ts) : abonnés, vues, dernière vidéo, relevés chaque lundi.
# API YouTube Data (clé YOUTUBE_API_KEY, quota gratuit). Aucun appel à une IA.
name: YouTube

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Relever les chaînes
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npx tsx scripts/youtube.ts
      - name: Valider
        run: npx tsx scripts/validate-content.ts
      - name: Publier le relevé
        run: |
          git config user.name "youtube-ca-vote[bot]"
          git config user.email "youtube@users.noreply.github.com"
          git add content/youtube/stats.json public/img/youtube
          git commit -m "youtube : relevé des chaînes ($(date -u +%Y%m%d))" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
